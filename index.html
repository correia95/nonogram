    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Nonogram",
        "url": "https://nonogram.correia95.workers.dev/",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "description": "A daily nonogram (picross) logic puzzle. Fill an 8x8 grid using row and column clues to reveal a picture; every puzzle has a verified unique solution."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What does a clue like 3 1 mean in a nonogram?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A block of 3 consecutive filled cells, then at least one empty cell, then a block of 1 - in that order, somewhere in the row or column."
            }
          },
          {
            "@type": "Question",
            "name": "Is there only one way to solve each puzzle?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes - every puzzle is verified to have exactly one solution before it's published, so if the clues are all satisfied, you've found the picture."
            }
          },
          {
            "@type": "Question",
            "name": "Does the daily puzzle change for everyone at the same time?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes - it's picked deterministically from today's date (UTC), so everyone sees the same puzzle on the same day, like a daily crossword."
            }
          }
        ]
      }
    </script>
